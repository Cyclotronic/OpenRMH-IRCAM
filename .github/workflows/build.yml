name: build

on:
  push:
    branches: [main]
    tags: ['v*']            # pushing a tag like v0.1.0 also publishes a GitHub Release
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-release-x64:
    runs-on: windows-2022        # Visual Studio 2022 17.14 with C++/CLI, ATL, .NET 4.7.2 pack, Windows SDK 22621/26100
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache third-party dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            src/packages
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/fetch-deps.ps1') }}

      - name: Fetch dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/fetch-deps.ps1

      - name: Build (Release|x64)
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist, dist/licenses | Out-Null
          Copy-Item "src/x64/Release/IRCAM Thermal Viewer.exe" dist/
          Copy-Item src/x64/Release/*.dll dist/
          Copy-Item LICENSE, NOTICE.md dist/
          # Licence texts of the redistributed third-party libraries
          Copy-Item deps/opencv/LICENSE.txt      dist/licenses/OpenCV-LICENSE.txt
          Copy-Item deps/opencv/LICENSE_FFMPEG.txt dist/licenses/OpenCV-FFmpeg-LGPL-LICENSE.txt
          Copy-Item deps/glfw/LICENSE.md         dist/licenses/GLFW-LICENSE.md
          Copy-Item deps/glew/LICENSE.txt        dist/licenses/GLEW-LICENSE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OpenRMH-IRCAM-win-x64
          path: dist/
          if-no-files-found: error

      - name: Download VC++ redistributable
        shell: pwsh
        run: |
          New-Item -ItemType Directory installer/payload -Force | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile "installer/payload/vc_redist.x64.exe" -UseBasicParsing

      - name: Determine installer version string
        id: version
        shell: pwsh
        run: |
          $v = if ("${{ github.ref }}" -like 'refs/tags/v*') { "${{ github.ref_name }}".Substring(1) } else { '0.0.0-dev' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss "/DAppVersion=${{ steps.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenRMH-IRCAM-installer
          path: installer-out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-release-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write               # create the release and upload the zip
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: OpenRMH-IRCAM-win-x64
          path: package

      - uses: actions/download-artifact@v4
        with:
          name: OpenRMH-IRCAM-installer
          path: installer-out

      - name: Create zip and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip_name="OpenRMH-IRCAM-${TAG}-win-x64.zip"
          (cd package && zip -qr "../${zip_name}" .)
          zip_sha=$(sha256sum "${zip_name}" | cut -d' ' -f1)
          setup_path=$(find installer-out -name '*-setup.exe' | head -1)
          setup_name=$(basename "$setup_path")
          setup_sha=$(sha256sum "$setup_path" | cut -d' ' -f1)
          cat > notes.md <<EOF
          Community build of **IRCAM Thermal Viewer 3.0.0** (September 2026 source release by Rune Mark Hansen), built from tag \`${TAG}\`
          by GitHub Actions. The program reports itself as version 3.0.0; the tag suffix numbers builds of this repository.

          **Install (installer, recommended):** run \`${setup_name}\`. It installs to Program Files, adds Start Menu/desktop
          shortcuts and an uninstaller, and silently installs the Microsoft Visual C++ Redistributable if needed - matching
          what the original author's own installer did.

          **Install (portable):** unzip \`${zip_name}\` anywhere and run \`IRCAM Thermal Viewer.exe\` directly - no install, no
          admin rights, but install the [VC++ Redistributable (x64)](https://aka.ms/vc14/vc_redist.x64.exe) yourself if the
          program reports a missing DLL.

          In the camera list choose your exact model (Thermal Master P2 Pro: *InfiRay Or Thermal Master P2Pro*).
          See docs/SUPPORTED-CAMERAS.md.

          **Requirements:** Windows 10/11 x64 and .NET Framework 4.7.2 or later (included in current Windows).

          **Notes**
          - Unsigned executable: Windows SmartScreen may warn on first run.
          - Only tested with a Thermal Master P2 Pro so far; other cameras on the supported list are untested.
          - Third-party libraries and their licences are in the \`licenses\` folder (portable zip) or the install folder
            (installer). \`opencv_videoio_ffmpeg490_64.dll\` is the FFmpeg plugin from the OpenCV 4.9.0 Windows release
            (LGPL-2.1+), unmodified; its source is available from the OpenCV and FFmpeg projects.
          - Licence of this software: MIT (see LICENSE, NOTICE.md).

          SHA-256 of the zip: \`${zip_sha}\`
          SHA-256 of the installer: \`${setup_sha}\`
          EOF
          awk -v t="## ${TAG} " 'index($0,t)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > changes.md || true
          if [ -s changes.md ]; then { printf '\n**Changes in this build**\n\n'; cat changes.md; } >> notes.md; fi
          gh release create "${TAG}" "${zip_name}" "$setup_path" --repo "${GITHUB_REPOSITORY}" --title "OpenRMH-IRCAM ${TAG}" --notes-file notes.md --verify-tag
